name: cardifly
description: "Cardifly mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State
  provider: ^6.1.5+1

  # Networking
  dio: ^5.10.0

  # Storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  localstorage: ^6.0.0

  # UX
  overlay_support: ^2.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # I18n
  intl: ^0.20.2

  # Files
  cross_file: ^0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.14

flutter:
  uses-material-design: true

  assets:
    - assets/dogs/
